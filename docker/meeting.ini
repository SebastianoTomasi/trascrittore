; Settings for the meeting transcriber container.
; When the shared folder holds a meeting.ini, Trascrivi.bat mounts it and points MEETING_CONFIG
; at it instead of this file, so thresholds and batch size can change without rebuilding the image.

[paths]
; The audio file comes from the command line.
input_path =
; Shared voice library, mounted read-only: one folder per person ("Nome Cognome"),
; with clips directly inside it or in subfolders.
enrollment_dir = /voci

[paths_output]
; Intermediate artifacts stay inside the container and disappear with it.
raw_asr_dir = /tmp/meeting/raw/asr
aligned_transcripts_dir = /tmp/meeting/raw/aligned
diarization_segments_dir = /tmp/meeting/raw/diarization_segments
diarized_words_dir = /tmp/meeting/raw/diarized_words
identified_words_dir = /tmp/meeting/raw/identified_words
diarized_transcripts_dir = /tmp/meeting/transcripts
speaker_identification_diagnostics_dir = /tmp/meeting/raw/speaker_identification
speaker_identification_windows_dir = /tmp/meeting/raw/speaker_identification_windows
; Voiceprint cache, mounted from the user's PC so the library is embedded only once.
cache_dir = /cache

[whisper]
model_id = large-v3
; auto = NVIDIA GPU when Docker exposes one, otherwise CPU (much slower, with a warning).
device = auto
; On CPU float16 is switched to int8 automatically.
compute_type = float16
; Lower this (4, 2, 1) if the run stops with "memoria della GPU esaurita".
batch_size = 8
language = it
initial_prompt = Riunione di lavoro in italiano.

[vad]
onset = 0.500
offset = 0.363
chunk_size = 30
min_duration_sec = 0.50

[diarization]
; Leave empty to let the model decide; Trascrivi.bat passes the exact count when the user knows it.
min_speakers =
max_speakers =

[embedding]
model_id = pyannote/embedding
sample_rate = 16000

[matching]
; A wrong name is worse than an anonymous "Persona N": keep these conservative.
; Calibrated 2026-09-24 by leave-one-out on 4 recordings (15 known voices, 7 guests/unknowns):
; true voices scored 0.58-0.82, a voice missing from the library at most 0.54.
; Recheck with the "speakers" block of the output JSON after real meetings.
threshold = 0.575
margin = 0.10
window_sec = 10.0
min_window_sec = 2.0
min_total_speech_sec = 4.0
max_windows_per_spk = 12
save_window_clips = false

[speaker]
unknown_prefix = UNKNOWN_

[time]
; Meeting files have free names and get times from the start of the recording.
; Names in this format (for example 250905_1420) also get a date in the intermediate artifacts.
filename_format = %y%m%d_%H%M
