; The transcriber's default settings, inside the image.
; A person changes a setting by writing only that line, under its section, in the trascrittore.ini next to
; the scripts: trascrittore.ps1 mounts that file and points TRANSCRIBER_SETTINGS at it. Everything the
; person does not change comes from here, so each update brings its new values.

[paths]
; The recording comes from the command line.
input_path =
; This PC's voice library: one folder per person ("Nome Cognome"), with clips directly inside it
; or in subfolders. Mounted read-only, except while naming speakers adds clips to it.
voice_library_dir = /voci

[paths_output]
; Intermediate artifacts stay inside the container and disappear with it.
raw_asr_dir = /tmp/transcriber/raw/asr
aligned_transcripts_dir = /tmp/transcriber/raw/aligned
diarization_segments_dir = /tmp/transcriber/raw/diarization_segments
diarized_words_dir = /tmp/transcriber/raw/diarized_words
recognized_words_dir = /tmp/transcriber/raw/recognized_words
diarized_transcripts_dir = /tmp/transcriber/transcripts
speaker_recognition_diagnostics_dir = /tmp/transcriber/raw/speaker_recognition
speaker_recognition_windows_dir = /tmp/transcriber/raw/speaker_recognition_windows
; Voiceprint cache, mounted from the person's PC so each pool's voiceprint is computed only once.
cache_dir = /cache

[whisper]
model_id = large-v3
; auto = NVIDIA GPU when Docker exposes one, otherwise CPU (much slower, with a warning).
device = auto
; auto = float16 on capable GPUs, a supported lower precision otherwise, int8 on CPU.
compute_type = auto
; Automatically capped at 1 on GPUs with 4 GB or less, 4 with up to 6 GB.
; Lower this further if the run stops with "memoria della GPU esaurita".
batch_size = 8
language = it
; The model reads this as if it had just been said: it steers words and spelling, it is not an instruction.
initial_prompt = Registrazione in italiano.

[vad]
onset = 0.500
offset = 0.363
chunk_size = 30
min_duration_sec = 0.50

[diarization]
; Leave empty to let the model decide; Trascrivi.bat passes the exact count when the user knows it.
min_speakers =
max_speakers =

[voiceprint]
model_id = pyannote/embedding
sample_rate = 16000

[matching]
; A wrong name is worse than an anonymous "Persona N": keep these conservative.
; Calibrated 2026-09-24 by leave-one-out on 4 recordings (15 voices in the library, 7 missing from it):
; true voices scored 0.58-0.82, a voice missing from the library at most 0.54.
; Recheck with Verifica.bat (the recognition check) after new speakers are named.
threshold = 0.575
margin = 0.10
window_sec = 10.0
min_window_sec = 2.0
min_total_speech_sec = 4.0
max_windows_per_spk = 12
save_window_clips = false

[library]
; Naming a speaker adds clips of their voice to voci/<Nome>/registrazioni: only the best keep_clips
; per recording, and none below min_consistency (how much a clip resembles the speaker's other
; stretches). min_consistency is a first guess that no review has confirmed.
keep_clips = 8
min_consistency = 0.60
; When a naming takes a person past max_clips added clips, the transcriber proposes
; which of them to remove, and removes them only when the person confirms.
max_clips = 64

[speaker]
anonymous_prefix = ANONYMOUS_

[time]
; Recordings usually have free names and get times from the start of the recording.
; Names in this format (for example 250905_1420) also get a date in the intermediate artifacts.
filename_format = %y%m%d_%H%M
