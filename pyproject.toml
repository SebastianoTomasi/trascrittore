[tool.poetry]
package-mode = false


[tool.poetry.dependencies]
torch = {source = "pytorch-cu128"}
torchaudio = {source = "pytorch-cu128"}

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[project]
name = "transcriber"
version = "0.1.0"
description = "Trascrive registrazioni in italiano con i nomi di chi parla, in un container Docker."
authors = [
    {name = "SebastianoTomasi",email = "sebastiantum12@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dotenv (>=0.9.9,<0.10.0)",
    "pyannote-audio (>=4.0.4,<5.0.0)",
    "soundfile (>=0.13.1,<0.14.0)",
    "torch (==2.8.0)",
    "torchaudio (==2.8.0)",
    "whisperx (>=3.8.1,<4.0.0)",
    "torchcodec (==0.7.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.0.0,<9.0.0)",
]

[tool.pytest.ini_options]
pythonpath = ["."]
